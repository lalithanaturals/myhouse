<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Household Accounts</title><style id="css">
/* VOICE formal household accounts for a joint family, like a small firm's books
   IDEA a ruled account ledger with a summary statement on top
   PICTURE the statement band: closing balance, receipts, payments, then ruled tables
   COLOUR charcoal #1f2328 band, white panels on stone #eceae6, brick #b3341f accent only
   TYPE Arial throughout. LAYOUT full-width band, tab rule, one column of ruled panels */
:root{color-scheme:light dark;--bg:light-dark(#eceae6,#121416);--panel:light-dark(#fff,#1c1f23);--ink:light-dark(#1f2328,#eceff2);--mut:light-dark(#5d6670,#9ba5af);--line:light-dark(#dcd8d2,#30353b);--m:light-dark(#1f2328,#2a2f35);--m2:light-dark(#1f2328,#d6dbe0);--btn:light-dark(#1f2328,#eceff2);--btnt:light-dark(#fff,#121416);--g:#b3341f;--in:light-dark(#1b6b45,#5cc690);--out:light-dark(#a3281c,#ff8a7d);--soft:light-dark(#f5f3f0,#23272c);--hink:#fff;--hsub:#c9ced4;--hb:4px solid #b3341f;--rad:3px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.hero{background:var(--m);color:var(--hink);padding:26px 0 22px;border-bottom:var(--hb)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--hsub);font-size:14px}
.bal{text-align:right}.bal .lbl{display:block;font-size:13px;color:var(--hsub)}
.bal .big{display:block;font-size:clamp(34px,6vw,54px);line-height:1.05;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;margin-top:8px;color:var(--hsub)}.mini b{color:var(--hink);white-space:nowrap}
@media(max-width:600px){.bal{text-align:left}.mini{justify-content:flex-start}}
nav{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;display:flex;align-items:center;padding:10px 14px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:700;border-bottom:3px solid transparent;min-height:46px}
nav a[aria-current]{color:var(--ink);border-color:var(--g)}
main{padding:24px 0 70px}
.grid{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));background:var(--panel);border:1px solid var(--line)}
.grid .card{border:0;border-right:1px solid var(--line);border-radius:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px}
h2{font-size:17px;margin:0 0 14px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line)}
.stat .n{font-size:26px;font-weight:700;white-space:nowrap;line-height:1.2;font-variant-numeric:tabular-nums}.stat .l{color:var(--mut);font-size:13px;margin-bottom:4px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;border-bottom:2px solid var(--ink);padding:6px 8px;text-transform:none}
td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
tbody tr:hover{background:var(--soft)}
.r{text-align:right;white-space:nowrap}.in{color:var(--in)}.out{color:var(--out)}
form.add{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px}
label.f{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--mut);gap:4px;flex:1 1 130px}
input,select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);color:var(--ink);min-height:42px;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--g);flex:none}
button{font:inherit;font-weight:700;font-size:14px;min-height:42px;padding:8px 16px;border-radius:var(--rad);border:1px solid var(--btn);background:var(--btn);color:var(--btnt);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink)}
button.x{background:transparent;border:0;color:var(--mut);padding:6px 10px;font-size:20px;line-height:1}
button.sm{min-height:34px;padding:3px 12px;font-size:13px}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:2px;font-size:12px;font-weight:700;white-space:nowrap}
.paid{background:light-dark(#e3f1e9,#15301f);color:var(--in)}.due{background:light-dark(#efede9,#2b2f34);color:var(--mut)}.late{background:light-dark(#f8e3df,#3a1a16);color:var(--out)}
.bar{display:grid;grid-template-columns:12em minmax(0,1fr) 6em;gap:10px;align-items:center;font-size:13px;margin:9px 0}
@media(max-width:600px){.bar{grid-template-columns:8.5em minmax(0,1fr) 5.5em}}
.bar i{display:block;height:10px;background:var(--m2)}.bar i.top{background:var(--g)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list a{color:var(--ink)}
.grow{flex:1}.muted{color:var(--mut);font-size:13px}
.note{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--g);padding:10px 14px;font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.days{display:flex;gap:4px;flex-wrap:wrap;flex:1 1 100%}.days label{display:flex;align-items:center;gap:4px;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--rad);min-height:42px;background:var(--panel)}
.days input{width:16px;height:16px}
.clean td.d,.clean th.d{text-align:center;width:3.6em}.clean .t{background:var(--soft)}
.dot{display:inline-block;width:8px;height:8px;background:var(--m2)}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.item{border:1px solid var(--line);border-radius:var(--rad);padding:10px 12px;margin-bottom:8px;background:var(--soft)}
.item .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.done .grow{text-decoration:line-through;color:var(--mut)}
.inl{display:flex;gap:6px;align-items:center}.inl input{width:7.5em;min-height:34px;padding:4px 8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--rad);display:flex;gap:12px;align-items:center;transition:transform .2s;z-index:9;max-width:92vw;font-size:14px}
#toast.on{transform:translate(-50%,0)}#toast button{background:var(--g);border-color:var(--g);color:#fff;min-height:34px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:12px;font-weight:700}.stack td:empty{display:none}}
.ed{border-color:transparent;background:transparent;min-height:36px;padding:4px 6px}.ed:hover,.ed:focus{border-color:var(--line);background:var(--panel)}
td .ed{width:100%}td.r .ed,.ed.r{text-align:right}
textarea{font:inherit;font-size:15px;width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);color:var(--ink);resize:vertical}
h3{font-size:14px;margin:18px 0 6px;color:var(--mut)}
.meter{height:10px;background:var(--soft);border:1px solid var(--line)}.meter i{display:block;height:100%;background:var(--m2)}.meter i.over{background:var(--g)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.menu td{padding:4px}.menu tr.t td{background:var(--soft)}.menu td:first-child{white-space:nowrap;padding-left:8px}
.inl select{width:auto;min-height:34px;padding:4px 6px}

:root[data-density=compact] body{font-size:14px}:root[data-density=compact] td{padding:5px 6px}:root[data-density=compact] .card{padding:12px 14px}:root[data-density=compact] main{padding-top:14px}:root[data-density=compact] .list li{padding:5px 0}:root[data-density=compact] .hero{padding:16px 0 14px}:root[data-density=compact] .cols,:root[data-density=compact] .board{gap:10px}
.themes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.sw{display:block;text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:0;overflow:hidden;font-weight:400;white-space:normal;border-radius:var(--rad)}
.sw[aria-pressed=true]{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}
.pv{background:var(--pbg);padding:0 0 10px}.pvh{background:var(--pm);color:var(--ph);padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--pg);font-size:12px}.pvh b{font-size:18px}
.pvn{display:flex;gap:10px;padding:6px 12px;background:var(--pp);font-size:11px;color:#888}.pvn span:first-child{color:var(--pi);border-bottom:2px solid var(--pg)}
.pvc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 4px}.pvc i{background:var(--pp);height:30px;border:1px solid rgba(128,128,128,.25);font-style:normal;font-size:11px;padding:3px 5px;color:var(--pi)}
.pvr{padding:2px 12px}.pvr span{display:block;height:7px;background:var(--p2);margin:5px 0}.pvr span.a{background:var(--pg)}
.pvbtn{display:inline-block;margin:6px 12px 0;padding:3px 10px;background:var(--pb);color:var(--pbt);font-size:11px;font-weight:700}
.swt{padding:10px 12px;border-top:1px solid var(--line)}.swt b{display:block}
.optrow{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--m);color:var(--hink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:20px 14px;border-right:var(--hb);scrollbar-width:thin}
.brand b{display:block;font-size:19px;line-height:1.2}.brand span{display:block;font-size:13px;color:var(--hsub);margin-top:4px;line-height:1.35}
.sbal{margin:18px 0 14px;padding:12px;border:1px solid color-mix(in srgb,var(--hsub) 40%,transparent);border-radius:var(--rad)}
.sbal span{font-size:13px;color:var(--hsub)}.sbal b{display:block;font-size:27px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}.sbal small{display:block;font-size:13px;color:var(--hsub);margin-top:2px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--rad);color:var(--hsub);text-decoration:none;font-size:14px;font-weight:700;min-height:42px;border-left:3px solid transparent;position:relative}
.snav a:hover{color:var(--hink);background:color-mix(in srgb,var(--hink) 8%,transparent)}
.snav a[aria-current]{color:var(--hink);background:color-mix(in srgb,var(--hink) 14%,transparent);border-left-color:var(--g)}
.snav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cnt{margin-left:auto;background:var(--g);color:#fff;font-size:12px;font-style:normal;border-radius:99px;padding:0 7px;line-height:19px;min-width:19px;text-align:center}
.sfoot{margin-top:auto;padding-top:16px;font-size:13px;color:var(--hsub);display:flex;flex-direction:column;gap:8px;align-items:flex-start}.signout{color:var(--hink)!important;border-color:color-mix(in srgb,var(--hink) 40%,transparent)!important;background:transparent!important}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:22px max(3vw,16px) 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:clamp(24px,3vw,32px)}.top p{margin:4px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--bg);white-space:nowrap}
.mainc main{padding:20px max(3vw,16px) 70px;max-width:1260px}
:root[data-density=compact] .mainc main{padding-top:12px}:root[data-density=compact] .top{padding-top:14px;padding-bottom:10px}:root[data-density=compact] .snav a{min-height:36px;padding:5px 10px}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;padding:12px 12px 0;border-right:0;border-bottom:var(--hb);overflow:visible}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.brand span,.sfoot{display:none}
.sbal{margin:8px 0 6px;padding:0;border:0;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.sbal b{font-size:24px}.sbal small{margin:0}
.snav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 6px}
.snav a{flex:none;flex-direction:column;gap:3px;font-size:12px;padding:8px 9px 7px;border-left:0;border-bottom:3px solid transparent;border-radius:0;min-height:56px;justify-content:center}
.snav a[aria-current]{border-bottom-color:var(--g);background:transparent}.snav a:hover{background:transparent}
.cnt{position:absolute;top:3px;right:2px;font-size:11px;line-height:16px;min-width:16px;padding:0 4px}}
.pv{display:grid;grid-template-columns:72px minmax(0,1fr);background:var(--pbg);height:128px;padding:0}
.pvs{background:var(--pm);color:var(--ph);padding:9px 7px;border-right:3px solid var(--pg)}.pvs b{display:block;font-size:12px;margin-bottom:8px}
.pvs i{display:block;height:6px;margin:7px 0;background:var(--ph);opacity:.3}.pvs i.on{opacity:1;background:var(--pg)}
.pvm{padding-top:4px}

:root[data-glass="1"] body{background:light-dark(#f4e9ec,#120a0f)}
:root[data-glass="1"] body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;background:radial-gradient(38% 42% at 14% 18%,light-dark(#e9a3b7,#7a2343) 0,transparent 70%),radial-gradient(34% 40% at 86% 12%,light-dark(#f7c86e,#7a4a06) 0,transparent 70%),radial-gradient(44% 48% at 78% 82%,light-dark(#9fd4d8,#0d4a50) 0,transparent 70%),radial-gradient(40% 44% at 22% 88%,light-dark(#cdb6ea,#3a2160) 0,transparent 70%),radial-gradient(30% 30% at 50% 50%,light-dark(#f3b9a3,#5a1f2a) 0,transparent 70%);animation:drift 45s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.08) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){:root[data-glass="1"] body::before{animation:none}}
:root[data-glass="1"] :is(.card,.top,.note,.item,#toast,.side){backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 light-dark(rgba(255,255,255,.9),rgba(255,255,255,.14)),inset 0 -1px 0 light-dark(rgba(255,255,255,.25),rgba(255,255,255,.04)),0 12px 32px light-dark(rgba(90,20,45,.12),rgba(0,0,0,.4))}
:root[data-glass="1"] .card{border-radius:20px;border:1px solid var(--line)}
:root[data-glass="1"] .grid{background:transparent;border:0;gap:14px}:root[data-glass="1"] .grid .card{border:1px solid var(--line);border-radius:20px}
:root[data-glass="1"] .app{grid-template-columns:262px minmax(0,1fr)}
:root[data-glass="1"] .side{margin:12px 0 12px 12px;top:12px;height:calc(100vh - 24px);border-radius:24px;border:1px solid rgba(255,255,255,.38)}
:root[data-glass="1"] .top{margin:12px 12px 0;border-radius:20px;border:1px solid var(--line)}
:root[data-glass="1"] .chip{background:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.07));border-color:var(--line)}
:root[data-glass="1"] .snav a{border-radius:14px;border-left:0}:root[data-glass="1"] .snav a[aria-current]{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-glass="1"] .sbal{border-radius:16px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
:root[data-glass="1"] .note{border-radius:16px;border:1px solid var(--line);border-left:1px solid var(--line)}
:root[data-glass="1"] button{border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}:root[data-glass="1"] button.ghost{background:light-dark(rgba(255,255,255,.5),rgba(255,255,255,.06));border-color:var(--line)}:root[data-glass="1"] button.x{box-shadow:none;background:transparent}
:root[data-glass="1"] input,:root[data-glass="1"] select,:root[data-glass="1"] textarea{border-radius:12px;border-color:var(--line)}:root[data-glass="1"] .ed{border-color:transparent}
:root[data-glass="1"] .tag{border-radius:99px}:root[data-glass="1"] th{border-bottom:1px solid light-dark(rgba(33,23,26,.3),rgba(255,255,255,.25))}
:root[data-glass="1"] .item{border-radius:14px}:root[data-glass="1"] .meter{border-radius:99px;overflow:hidden}:root[data-glass="1"] .bar i,:root[data-glass="1"] .meter i{border-radius:99px}
:root[data-glass="1"] .sw{border-radius:18px}
@media(max-width:860px){:root[data-glass="1"] .app{grid-template-columns:minmax(0,1fr)}:root[data-glass="1"] .side{margin:8px;height:auto;border-radius:20px;padding-bottom:0}:root[data-glass="1"] .top{margin:8px 8px 0}:root[data-glass="1"] .snav a{border-radius:0}}
td[data-l=Date],td[data-l=Reported],td[data-l=Sent]{white-space:nowrap}

.card,.item,.sw,.snav a,.chip,button,.list li,.tag,.stat .n,input,select,textarea{transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s cubic-bezier(.2,.8,.2,1),background-color .25s ease,border-color .25s ease,color .25s ease,opacity .25s ease}
tbody tr{transition:background-color .2s ease}
@media(hover:hover){
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px light-dark(rgba(70,20,40,.13),rgba(0,0,0,.45))}
.grid .card:hover,.item:hover,.sw:hover{transform:translateY(-4px);box-shadow:0 18px 40px light-dark(rgba(70,20,40,.16),rgba(0,0,0,.5))}
.grid .card:hover .n{transform:scale(1.03)}.stat .n{transform-origin:left center}
.snav a:hover{transform:translateX(4px)}.snav a[aria-current]:hover{transform:translateX(2px)}
.list li:hover{transform:translateX(4px)}
.chip:hover{transform:translateY(-2px)}
button:hover{transform:translateY(-2px);box-shadow:0 8px 18px light-dark(rgba(70,20,40,.18),rgba(0,0,0,.4))}
button.x:hover{transform:rotate(90deg);box-shadow:none;color:var(--out)}
input:hover,select:hover{border-color:light-dark(rgba(107,29,54,.35),rgba(255,255,255,.3))}}
button:active{transform:translateY(0) scale(.96);transition-duration:.08s}
:root[data-glass="1"] .card:hover,:root[data-glass="1"] .grid .card:hover,:root[data-glass="1"] .item:hover,:root[data-glass="1"] .sw:hover{box-shadow:inset 0 1px 0 light-dark(rgba(255,255,255,.95),rgba(255,255,255,.18)),0 20px 44px light-dark(rgba(90,20,45,.18),rgba(0,0,0,.5))}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{width:0}}
.enter .top{animation:fade .4s ease both}.enter .top h1{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.enter .top p{animation:rise .5s cubic-bezier(.2,.8,.2,1) .06s both}
.enter main>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter main>*:nth-child(2){animation-delay:.07s}.enter main>*:nth-child(3){animation-delay:.14s}.enter main>*:nth-child(4){animation-delay:.21s}
.enter .grid>.card,.enter .board>.card,.enter .cols>.card,.enter .themes>.sw{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter .grid>.card:nth-child(2),.enter .cols>.card:nth-child(2),.enter .board>.card:nth-child(2),.enter .themes>.sw:nth-child(2){animation-delay:.06s}
.enter .grid>.card:nth-child(3),.enter .board>.card:nth-child(3),.enter .themes>.sw:nth-child(3){animation-delay:.12s}
.enter .grid>.card:nth-child(4),.enter .themes>.sw:nth-child(4){animation-delay:.18s}
.enter .themes>.sw:nth-child(n+5){animation-delay:.24s}

<div class="card"><h2>Receipts by source</h2><ul class="list">${IN_CATS.map(c=>[c,sum(mt.filter(t=>isIn(t)&&t.cat===c),t=>t.amt)]).filter(x=>x[1]||[C.led,C.ln,C.rent].includes(x[0])).map(([c,v])=>`<li><span class="grow">${esc(c)}</span><b class="in">${INR(v)}</b></li>`).join('')}</ul>
<h2 style="margin-top:22px">Recent transactions</h2><ul class="list">${[...S.txns].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(t=>`<li><span class="muted" style="width:3.8em">${dFmt(t.date)}</span><span class="grow">${esc(t.note||t.cat)}</span><b class="${t.type==='tr'?'muted':t.type}">${isIn(t)?'+':isOut(t)?'−':''}${INR(t.amt)}</b></li>`).join('')}</ul></div></div>
<div class="card" style="margin-top:16px"><h2 class="hrow">Budget vs actual · ${mName(ym)}<button class="sm ghost addo" data-act="addOpt" data-id="budgetCats">+ Add category</button></h2><table class="stack"><thead><tr><th>Category</th><th class="r">Monthly budget</th><th class="r">Spent</th><th class="r">Balance</th><th style="width:30%">Used</th></tr></thead><tbody>
${BUDGET_CATS.map(c=>{const b=+S.budgets[c]||0,s=spent(c),p=b?Math.min(100,s/b*100):0;return `<tr>${td('Category',esc(c))}<td data-l="Budget" class="r"><input class="ed r" type="number" min="0" value="${b}" data-chg="budget" data-cat="${esc(c)}" aria-label="Budget for ${esc(c)}" style="width:7.5em"></td>${td('Spent',INR(s),'r')}${td('Balance',`<span class="${b-s<0?'out':''}">${INR(b-s)}</span>`,'r')}<td data-l="Used"><div class="meter"><i class="${s>b?'over':''}" style="width:${p}%"></i></div></td></tr>`}).join('')}
</tbody><tfoot><tr><td>Total</td><td class="r">${INR(sum(BUDGET_CATS,c=>S.budgets[c]))}</td><td class="r">${INR(sum(BUDGET_CATS,c=>spent(c)))}</td><td class="r">${INR(sum(BUDGET_CATS,c=>(+S.budgets[c]||0)-spent(c)))}</td><td></td></tr></tfoot></table></div>`},

ledger(){const months=[...new Set([ym,fMonth,...S.txns.map(t=>t.date.slice(0,7))])].sort().reverse(),rows=ofMonth(fMonth).filter(t=>!fCat||t.cat===fCat).sort((a,b)=>b.date.localeCompare(a.date)),tin=sum(rows.filter(isIn),t=>t.amt),tout=sum(rows.filter(isOut),t=>t.amt);
return `<div class="card"><h2>Post a transaction</h2><form class="add" data-form="txn">
<label class="f">Date<input type="date" name="date" value="${today}" required></label>
<label class="f" style="flex-basis:280px">Category${sA('cat','cat',catOpts(C.gro))}</label>
<label class="f">Amount (₹)<input type="number" name="amt" min="1" step="1" inputmode="numeric" required></label>
<label class="f" style="flex-basis:220px">Particulars<input name="note" placeholder="Description"></label>
<label class="f" style="flex-basis:170px">Mode${modeSel()}</label>
<label class="f">Member / handled by<input name="by" list="ppl"></label><button>Post entry</button></form>
<div class="note"><span class="inl"><select data-chg="month" aria-label="Period" style="width:auto">${months.map(m=>`<option value="${m}"${m===fMonth?' selected':''}>${mName(m)}</option>`).join('')}</select><select data-chg="fcat" aria-label="Category filter" style="width:auto"><option value="">All categories</option>${opts([...IN_CATS,...OUT_CATS,C.itr],fCat)}</select></span><span>Receipts <b class="in">${INR(tin)}</b> · Payments <b class="out">${INR(tout)}</b> · Net <b>${INR(tin-tout)}</b></span><button class="sm ghost" data-act="csv">Copy for Excel</button></div>
${rows.length?`<table class="stack"><thead><tr><th>Date</th><th>Category</th><th>Particulars</th><th>Mode</th><th>Member</th><th class="r">Receipts</th><th class="r">Payments</th><th></th></tr></thead><tbody>
${rows.map(t=>{const[a,b]=amtCell(t);return `<tr>${td('Date',dFmt(t.date))}${td('Category',esc(t.cat))}${td('Particulars',esc(t.note))}${td('Mode',esc(t.mode))}${td('Member',esc(t.by))}${td('Receipts',a,'r')}${td('Payments',b,'r')}<td class="r"><button class="x" aria-label="Delete entry" data-act="del" data-id="txns:${t.id}">×</button></td></tr>`}).join('')}</tbody></table>`:'<p class="muted">No transactions in this period.</p>'}</div>`},

dues(){const rs=[...S.recur].sort((a,b)=>(a.dir>b.dir?-1:1)||a.day-b.day);return `<div class="card"><h2>Recurring bills, dues & receipts</h2><form class="add" data-form="recur">
<label class="f" style="flex-basis:220px">Name<input name="name" placeholder="e.g. Chit – second group" required></label>
<label class="f">Type<select name="dir"><option value="out">Payment</option><option value="in">Receipt</option></select></label>
<label class="f" style="flex-basis:260px">Category${sA('cat','cat',catOpts('Mobile Bills'))}</label>
<label class="f">Amount (₹)<input type="number" name="amt" min="0" required></label>
<label class="f">Due day<input type="number" name="day" min="1" max="31" value="10" required></label>
<label class="f">Frequency<select name="freq"><option value="1">Monthly</option><option value="3">Every 3 months</option><option value="6">Every 6 months</option><option value="12">Yearly</option></select></label>
<label class="f">First due month<select name="start">${MONTHS.map((m,i)=>`<option value="${i+1}"${i+1===now.getMonth()+1?' selected':''}>${m}</option>`).join('')}</select></label><button>Add</button></form>
<table class="stack"><thead><tr><th>Name</th><th>Category</th><th>Frequency</th><th class="r">Due day</th><th class="r">Amount</th><th>Status</th><th></th><th></th></tr></thead><tbody>
${rs.map(r=>{const[c,l]=recState(r),open=dueIn(r,ym)&&c!=='paid';return `<tr><td data-l="Name">${ed('recur',r.id,'name',r.name,'Name')}</td>${td('Category',`${r.dir==='in'?'<span class="tag paid">Receipt</span> ':''}${esc(r.cat)}`)}${td('Frequency',{1:'Monthly',3:'Quarterly',6:'Every 6 months',12:'Yearly'}[r.freq]+(+r.freq!==1?' from '+MONTHS[r.start-1]:''))}<td data-l="Due day" class="r">${ed('recur',r.id,'day',r.day,'Due day','number')}</td><td data-l="Amount" class="r">${ed('recur',r.id,'amt',r.amt,'Amount','number')}</td>${td('Status',`<span class="tag ${c}">${l}</span>`)}<td data-l="">${open?payForm('payRec',r.id,r.amt,r.dir==='in'?'Receive':'Pay'):''}</td><td class="r"><button class="x" aria-label="Delete" data-act="del" data-id="recur:${r.id}">×</button></td></tr>`}).join('')}</tbody></table>
<p class="muted">Paying or receiving posts the entry to the Ledger. Property tax is set to fall due in April and October; change the first due month if yours differs. To reverse a payment, delete the ledger entry.</p></div>`},

payroll(){return `<div class="card"><h2>Payroll · ${mName(ym)}</h2><form class="add" data-form="staff">
<label class="f">Employee name<input name="name" required></label><label class="f" style="flex-basis:220px">Duties<input name="role" placeholder="Cooking, cleaning…"></label><label class="f">Monthly salary (₹)<input type="number" name="amt" min="0" required></label><button>Add employee</button></form>
<table class="stack"><thead><tr><th>Employee</th><th>Duties</th><th class="r">Salary</th><th>Status</th><th></th><th></th></tr></thead><tbody>
${S.staff.map(s=>{const t=S.txns.find(x=>x.id===s.paid?.[ym]);return `<tr><td data-l="Employee">${ed('staff',s.id,'name',s.name,'Name')}</td><td data-l="Duties">${ed('staff',s.id,'role',s.role,'Duties')}</td><td data-l="Salary" class="r">${ed('staff',s.id,'amt',s.amt,'Salary','number')}</td>${td('Status',t?`<span class="tag paid">Paid ${INR(t.amt)} · ${dFmt(t.date)}</span>`:'<span class="tag due">Unpaid</span>')}<td data-l="">${t?'':payForm('paySal',s.id,s.amt,'Pay')}</td><td class="r"><button class="x" aria-label="Remove" data-act="del" data-id="staff:${s.id}">×</button></td></tr>`}).join('')}</tbody></table>
<p class="muted">Monthly payroll: <b>${INR(sum(S.staff,s=>s.amt))}</b>. Replace the placeholder names with your maids' names. Record advances in the Ledger under Staff Salaries.</p></div>`},

family(){const mt=ofMonth(ym),trs=mt.filter(t=>t.frm||t.to).sort((a,b)=>b.date.localeCompare(a.date));
return `<div class="cols" style="margin-top:0"><div class="card"><h2>Family members (${S.members.length})</h2><table class="stack"><thead><tr><th>Name</th><th>Relation</th><th>Notes</th><th></th></tr></thead><tbody>
${S.members.map(m=>`<tr><td data-l="Name">${ed('members',m.id,'name',m.name,'Name')}</td><td data-l="Relation">${ed('members',m.id,'rel',m.rel,'Relation')}</td><td data-l="Notes">${ed('members',m.id,'note',m.note,'Notes')}</td><td class="r"><button class="x" aria-label="Remove member" data-act="del" data-id="members:${m.id}">×</button></td></tr>`).join('')}</tbody></table>
<form class="add" data-form="member" style="margin:14px 0 0"><label class="f">Name<input name="name" required></label><label class="f">Relation<input name="rel" placeholder="Cousin, uncle…"></label><label class="f" style="flex-basis:180px">Notes<input name="note"></label><button>Add member</button></form><p class="muted">Type real names over the placeholders; tasks, schedules and ledger entries update with them.</p></div>
<div class="card"><h2>Record a family transfer</h2><form class="add" data-form="transfer">
<label class="f">Date<input type="date" name="date" value="${today}"></label><label class="f">From${sA('frm','member',`<option>${HF}</option>${opts(S.members.map(m=>m.name))}`)}</label><label class="f">To${sA('to','member',`${opts(S.members.map(m=>m.name))}<option>${HF}</option>`)}</label>
<label class="f">Amount (₹)<input type="number" name="amt" min="1" required></label><label class="f" style="flex-basis:170px">Mode${modeSel()}</label><label class="f" style="flex-basis:200px">Purpose<input name="note" placeholder="Allowance, loan return…"></label><button>Record</button></form>
<p class="muted">From or to the house fund changes the closing balance. Between two members it is recorded for reference only.</p></div></div>
<div class="card" style="margin-top:16px"><h2>Member summary · ${mName(ym)}</h2><table class="stack"><thead><tr><th>Member</th><th class="r">Expenses handled</th><th class="r">Personal expenses</th><th class="r">From house fund</th><th class="r">Internal received</th><th class="r">Internal given</th></tr></thead><tbody>
${S.members.map(m=>{const n=m.name,f=x=>sum(mt.filter(x),t=>t.amt);return `<tr>${td('Member','<b>'+esc(n)+'</b>')}${td('Expenses handled',INR(f(t=>isOut(t)&&t.by===n&&t.cat!==C.fout)),'r')}${td('Personal',INR(f(t=>isOut(t)&&t.by===n&&t.cat===C.pers)),'r')}${td('From house fund',INR(f(t=>t.cat===C.fout&&t.to===n)),'r')}${td('Internal received',INR(f(t=>t.type==='tr'&&t.to===n)),'r')}${td('Internal given',INR(f(t=>t.type==='tr'&&t.frm===n)),'r')}</tr>`}).join('')}</tbody></table>
<h2 style="margin-top:22px">Transfers this month</h2>${trs.length?`<ul class="list">${trs.map(t=>`<li><span class="muted" style="width:3.8em">${dFmt(t.date)}</span><span class="grow">${esc(t.frm)} → ${esc(t.to)} <span class="muted">${esc(t.note)}</span></span><b>${INR(t.amt)}</b><button class="x" aria-label="Delete" data-act="del" data-id="txns:${t.id}">×</button></li>`).join('')}</ul>`:'<p class="muted">No transfers this month.</p>'}</div>`},

procure(){const secs=[...new Set([...S.opts.secs,...S.groceries.map(x=>x.sec||C.gro)])];return `<div class="cols" style="margin-top:0"><div class="card"><h2>Procurement list</h2><form class="add" data-form="groc"><label class="f" style="flex-basis:200px">Item<input name="item" required></label><label class="f">Quantity<input name="qty" placeholder="2 kg"></label><label class="f" style="flex-basis:220px">Section${sA('sec','secs',opts(S.opts.secs))}</label><button>Add item</button></form>
${secs.map(sec=>{const g=S.groceries.filter(x=>(x.sec||C.gro)===sec).sort((a,b)=>a.done-b.done);return `<h3>${sec}</h3><ul class="list">${g.map(x=>`<li class="${x.done?'done':''}"><input type="checkbox" data-chg="groc" data-id="${x.id}" aria-label="Purchased ${esc(x.item)}"${x.done?' checked':''}><span class="grow">${esc(x.item)} <span class="muted">${esc(x.qty)}</span></span><button class="x" aria-label="Delete" data-act="del" data-id="groceries:${x.id}">×</button></li>`).join('')||'<li class="muted">No items.</li>'}</ul>`}).join('')}
${S.groceries.some(x=>x.done)?'<p><button class="ghost sm" data-act="clearBought">Clear purchased items</button></p>':''}</div>
<div class="card"><h2>Record a purchase</h2><form class="add" data-form="purchase"><label class="f" style="flex-basis:240px">Category${sA('cat','outCats',opts(FORM_OUT,C.gro))}</label><label class="f">Amount (₹)<input type="number" name="amt" min="1" required></label><label class="f">Vendor<input name="note" placeholder="Supermarket, rythu bazaar…"></label><label class="f" style="flex-basis:170px">Mode${modeSel()}</label><label class="f">Purchased by<input name="by" list="ppl"></label><button>Post to ledger</button></form>

clean(){return `<div class="card"><h2>Weekly housekeeping schedule</h2><form class="add" data-form="clean"><label class="f" style="flex-basis:220px">Task<input name="task" required></label><label class="f">Responsible<input name="who" list="ppl" required></label><label class="f" style="flex-basis:170px">Time${sA('time','slots',opts(SLOTS))}</label><div class="days">${DAYS.map((d,i)=>`<label><input type="checkbox" name="day" value="${i}">${d}</label>`).join('')}</div><button>Add task</button></form>

${[...new Set([...SLOTS,...S.cleaning.map(c=>c.time||'Morning')])].map(sl=>S.cleaning.filter(c=>(c.time||'Morning')===sl).map(c=>`<tr><td>${esc(c.task)}</td><td>${esc(c.who)}</td><td class="muted">${sl}</td>${DAYS.map((d,i)=>`<td class="d${i===tIdx?' t':''}">${c.days.includes(i)?(i===tIdx?`<input type="checkbox" data-chg="clean" data-id="${c.id}" aria-label="Done today"${S.cleanDone[today+'|'+c.id]?' checked':''}>`:'<span class="dot"></span>'):''}</td>`).join('')}<td class="r"><button class="x" aria-label="Delete" data-act="del" data-id="cleaning:${c.id}">×</button></td></tr>`).join('')).join('')}</tbody></table></div>

<div class="card" style="margin-top:16px"><h2>Monthly housekeeping · ${mName(ym)}</h2><form class="add" data-form="monthly"><label class="f" style="flex-basis:240px">Task<input name="task" required></label><label class="f">Responsible<input name="who" list="ppl" required></label><label class="f">Week<select name="week">${[1,2,3,4].map(w=>`<option value="${w}">Week ${w}</option>`).join('')}</select></label><button>Add</button></form>

meals(){const W=S.menu[mWeek-1],ML=['Breakfast','Lunch','Evening snack','Dinner'];return `<div class="card"><h2>Meal plan · 4-week monthly rotation</h2>
<div class="seg">${[1,2,3,4].map(w=>`<button class="sm ${w===mWeek?'':'ghost'}" data-act="week" data-id="${w}">Week ${w}${w===wk?' (this week)':''}</button>`).join('')}</div>

tasks(){const col=(st,t)=>`<div class="card"><h2>${t} <span class="muted">${S.work.filter(w=>w.status===st).length}</span></h2>${S.work.filter(w=>w.status===st).sort((a,b)=>(a.due||'z').localeCompare(b.due||'z')).map(w=>`<div class="item ${st==='done'?'done':''}"><div class="row"><b class="grow">${esc(w.task)}</b><button class="x" aria-label="Delete" data-act="del" data-id="work:${w.id}">×</button></div><div class="row"><span class="muted">${esc(w.who)}${w.due?' · due '+dFmt(w.due):''}${st!=='done'&&w.due&&w.due<today?' · <span class="out">overdue</span>':''}</span><button class="sm ghost" data-act="next" data-id="${w.id}">${st==='todo'?'Start':st==='doing'?'Complete':'Reopen'}</button></div></div>`).join('')||'<p class="muted">Nothing here.</p>'}</div>`;
return `<div class="card" style="margin-bottom:16px"><h2>Assign a task</h2><form class="add" data-form="work" style="margin:0"><label class="f" style="flex-basis:240px">Task<input name="task" required></label><label class="f">Assigned to<input name="who" list="ppl" required></label><label class="f">Due date<input type="date" name="due"></label><button>Assign task</button></form></div><div class="board">${col('todo','Pending')}${col('doing','In progress')}${col('done','Completed')}</div>`},

design(){const D=S.design,seg=(k,vals)=>`<div><h3>${k==='density'?'Spacing':'Corners'}</h3><div class="seg">${vals.map(([v,l])=>`<button class="sm ${D[k]===v?'':'ghost'}" data-act="dopt" data-id="${k}:${v}" aria-pressed="${D[k]===v}">${l}</button>`).join('')}</div></div>`;
return `<div class="card"><h2>Choose a design</h2><p class="muted" style="margin-top:-4px">Tap a design to apply it to the whole app straight away. Your choice is saved for everyone in the family. All designs use Arial.</p>

loans(){const tx=(id,c)=>S.txns.filter(t=>t.ref===id&&(!c||t.cat===c)),ch=S.loans.filter(x=>x.kind==='chit'),ln=S.loans.filter(x=>x.kind==='loan');

try{const s=await ref.get();if(!s.exists)await ref.set({seen:today,entries:[],name:W.name||'',email:W.email||''});else if(s.data().seen!==today)await ref.update({seen:today,name:W.name||''})}catch(e){readOnly=true}
db.doc('inbox/'+me).onSnapshot(s=>{MYBOX=s.exists?s.data():{entries:[]};renderFamily()},()=>{});
db.doc('shared/home').onSnapshot(s=>{HOME=s.exists?s.data():null;if(HOME?.design)S.design=HOME.design;setStatus('Ready');renderFamily()},()=>{});
db.doc('shared/access').onSnapshot(s=>{ACC=normAcc(s.exists?s.data():{});renderFamily()},()=>{});
db.doc('ticks/home').onSnapshot(s=>{const d=s.exists?s.data():{};TK={cleanDone:d.cleanDone||{},groc:d.groc||{},tasks:d.tasks||{}};renderFamily()},()=>{})}
let famLast=null;
function renderFamily(){applyDesign();if(notAllowed){$('#root').innerHTML=`<div class="loading"><b>Household</b><span>${esc(me)} hasn’t been added yet.</span><span>Ask an admin to add this Google email on Users & Access, then refresh.</span>${window.fbSignOut?'<button class="sm ghost" data-act="signout">Use a different account</button>':''}</div>`;return}const P=permOf(me),H=HOME||{},items=FT.filter(([,m])=>!m||P.mods[m]),h=location.hash.slice(1),v=items.some(i=>i[0]===h)?h:(items[0]?.[0]||'f-mine'),changed=v!==famLast;famLast=v;
const mine=(MYBOX?.entries||[]).slice().reverse(),pend=mine.filter(e=>e.status==='pending').length,o=H.opts||DEF,cats=P.cats.length?P.cats:(o.outCats||[]);
const form=(kind,catList,defCat,title)=>`<div class="card"><h2>${title}</h2><form class="add" data-form="fentry"><input type="hidden" name="kind" value="${kind}"><label class="f">Date<input type="date" name="date" value="${today}" required></label><label class="f" style="flex-basis:240px">Category<select name="cat">${opts(catList,defCat)}</select></label><label class="f">Amount (₹)<input type="number" name="amt" min="1" ${P.max?`max="${P.max}"`:''} required></label><label class="f" style="flex-basis:220px">Particulars<input name="note" placeholder="What was it for?"></label><label class="f">Mode<select name="mode">${opts(o.modes||DEF.modes)}</select></label><button>Send</button></form>${P.max?`<p class="muted">Limit per entry: ${INR(P.max)}.</p>`:''}<p class="muted">${P.auto?'Entries within your limits are posted automatically.':'An admin checks each entry before it is added.'}</p></div>`;
const page={
'f-expense':()=>form('expense',cats,cats[0],'Add an expense'),
'f-receipt':()=>form('receipt',(o.inCats||[]),(o.inCats||[])[0],'Add money received'),
'f-purchase':()=>form('purchase',[C.gro,C.fv,C.med].filter(c=>!P.cats.length||P.cats.includes(c)),C.gro,'Record a purchase'),
'f-shop':()=>{const g=H.groceries||[],secs=[...new Set([...(o.secs||[]),...g.map(x=>x.sec)])];return `<div class="cols" style="margin-top:0"><div class="card"><h2>Shopping list</h2>${secs.map(sec=>{const L=g.filter(x=>x.sec===sec);return L.length?`<h3>${esc(sec)}</h3><ul class="list">${L.map(x=>{const dn=!!TK.groc?.[x.id];return `<li class="${dn?'done':''}"><input type="checkbox" data-chg="ftick" data-p="groc" data-id="${x.id}"${dn?' checked':''} aria-label="Bought ${esc(x.item)}"><span class="grow">${esc(x.item)} <span class="muted">${esc(x.qty)}</span></span></li>`}).join('')}</ul>`:''}).join('')||'<p class="muted">The list is empty.</p>'}</div>
<div class="card"><h2>Ask for an item</h2><form class="add" data-form="fentry"><input type="hidden" name="kind" value="shop"><label class="f" style="flex-basis:200px">Item<input name="item" required></label><label class="f">Quantity<input name="qty"></label><label class="f">Section<select name="sec">${opts(o.secs||DEF.secs)}</select></label><button>Send</button></form></div></div>`},
'f-maint':()=>`<div class="card"><h2>Report a repair</h2><form class="add" data-form="fentry"><input type="hidden" name="kind" value="maint"><label class="f" style="flex-basis:260px">What needs fixing<input name="item" required></label><label class="f">Where<select name="asset">${opts(o.assets||DEF.assets)}</select></label><input type="hidden" name="date" value="${today}"><button>Send</button></form>
<h3>Open requests</h3><ul class="list">${(H.repairs||[]).filter(r=>r.status==='open').map(r=>`<li><span class="grow">${esc(r.item)} <span class="muted">· ${esc(r.asset)}</span></span><span class="muted">${dFmt(r.date)}</span></li>`).join('')||'<li class="muted">None open.</li>'}</ul></div>`,
'f-clean':()=>{const cl=H.cleaning||[],td_=cl.filter(c=>(c.days||[]).includes(tIdx));return `<div class="card"><h2>Today · ${DAYL[tIdx]}</h2><ul class="list">${td_.map(c=>{const k=today+'|'+c.id,dn=!!TK.cleanDone?.[k];return `<li class="${dn?'done':''}"><input type="checkbox" data-chg="ftick" data-p="cleanDone" data-id="${k}"${dn?' checked':''} aria-label="Done"><span class="grow">${esc(c.task)} <span class="muted">· ${esc(c.who)} · ${esc(c.time||'')}</span></span></li>`}).join('')||'<li class="muted">Nothing scheduled today.</li>'}</ul></div>
<div class="card" style="margin-top:16px"><h2>This week</h2><div class="scroll"><table class="clean"><thead><tr><th>Task</th><th>Who</th>${DAYS.map((d,i)=>`<th class="d${i===tIdx?' t':''}">${d}</th>`).join('')}</tr></thead><tbody>${cl.map(c=>`<tr><td>${esc(c.task)}</td><td>${esc(c.who)}</td>${DAYS.map((d,i)=>`<td class="d${i===tIdx?' t':''}">${(c.days||[]).includes(i)?'<span class="dot"></span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`},
'f-meals':()=>{const W=(H.menu||[])[mWeek-1]||[],ML=['Breakfast','Lunch','Evening snack','Dinner'];return `<div class="card"><h2>Meal plan</h2><div class="seg">${[1,2,3,4].map(w=>`<button class="sm ${w===mWeek?'':'ghost'}" data-act="fweek" data-id="${w}">Week ${w}${w===wk?' (this week)':''}</button>`).join('')}</div><table class="stack menu"><thead><tr><th>Day</th>${ML.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${DAYL.map((d,i)=>`<tr class="${mWeek===wk&&i===tIdx?'t':''}">${td('Day','<b>'+d+'</b>')}${ML.map((m,j)=>td(m,esc((W[i]||[])[j]||''))).join('')}</tr>`).join('')}</tbody></table>${H.menuNotes?`<p class="muted">${esc(H.menuNotes)}</p>`:''}</div>`},
'f-tasks':()=>{const ws=(H.work||[]).filter(w=>!P.member||w.who===P.member);return `<div class="card"><h2>${P.member?'Tasks for '+esc(P.member):'Household tasks'}</h2>${ws.map(w=>{const st=TK.tasks?.[w.id]||'todo';return `<div class="item ${st==='done'?'done':''}"><div class="row"><b class="grow">${esc(w.task)}</b><span class="tag ${st==='done'?'paid':st==='doing'?'due':'late'}">${st==='done'?'Completed':st==='doing'?'In progress':'Pending'}</span></div><div class="row"><span class="muted">${esc(w.who)}${w.due?' · due '+dFmt(w.due):''}</span><button class="sm ghost" data-act="ftask" data-id="${w.id}">${st==='todo'?'Start':st==='doing'?'Complete':'Reopen'}</button></div></div>`}).join('')||'<p class="muted">No tasks assigned.</p>'}</div>`},
'f-mine':()=>`<div class="card"><h2>My entries</h2>${mine.length?`<ul class="list">${mine.map(e=>`<li><span class="tag ${e.status==='approved'?'paid':e.status==='rejected'?'late':'due'}">${e.status==='approved'?'Added':e.status==='rejected'?'Not accepted':'Waiting'}</span><span class="grow">${esc(MODL[e.kind]||e.kind)} · ${entryText(e)}</span></li>`).join('')}</ul>`:'<p class="muted">You have not sent anything yet.</p>'}</div>`};
const title=(FT.find(f=>f[0]===v)||[])[2]||'Household';
$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>Household</b><span>${esc(P.name||PROF[me]||'Family member')} · family entry</span></div>
<div class="sbal"><span>Your entries</span><b>${pend} waiting</b><small>${mine.filter(e=>e.status==='approved').length} added · ${mine.filter(e=>e.status==='rejected').length} not accepted</small></div>
<div class="snav" role="navigation" aria-label="Sections">${items.map(([k,,l,ic])=>`<a href="#${k}"${k===v?' aria-current="page"':''}>${ico(ic)}<span>${l}</span>${k==='f-mine'&&pend?`<em class="cnt">${pend}</em>`:''}</a>`).join('')}</div><div class="sfoot"><span id="st">${esc(status)}</span>${window.fbSignOut?`<button class="sm ghost signout" data-act="signout">Sign out</button>`:""}</div></aside>
<div class="mainc${changed?' enter':''}"><header class="top"><div><h1>${title}</h1><p class="muted">${role==='loading'?'Loading…':'Enter details here. Admins see and approve them.'}</p></div><div class="chips"><span class="chip">${DAYL[tIdx]}, ${dFmt(today)}</span></div></header>
<main>${P.blocked?'<div class="note">Your access is paused. Please ask an admin.</div>':readOnly?'<div class="note">You can look but not send entries. Ask the owner to share the app with you as Contributor.</div>':''}${!HOME&&role==='family'?'<div class="note">Waiting for an admin to finish setting up.</div>':''}${P.blocked?'':(page[v]||page['f-mine'])()}</main></div></div>`}
function sendEntry(kind,data){const P=permOf(me),e={id:uid_(),at:new Date().toISOString(),kind,data,status:'pending'};const f=flagsOf(me,e);if(f.length){toast(f[0]);return}if(readOnly){toast('You can’t send entries yet');return}
MYBOX=MYBOX||{entries:[]};const entries=[...(MYBOX.entries||[]),e];MYBOX={...MYBOX,entries};renderFamily();setStatus('Sending…');
boxQ=boxQ.then(()=>db.doc('inbox/'+me).update({entries})).then(()=>{setStatus('Sent');toast(P.auto?'Sent — it will be posted automatically':'Sent for approval')}).catch(err=>{setStatus(errMsg(err));toast('Could not send — try again')})}
async function famTick(part,key,val){if(readOnly)return;tick(part,key,val);renderFamily();const p=TKP;TKP={};try{await db.doc('ticks/home').update(p)}catch(e){try{await db.doc('ticks/home').set(Object.assign({cleanDone:{},groc:{},tasks:{}},p))}catch(e2){toast('Could not save that tick')}}}

Object.assign(F,{addFam(d){const em=(d.email||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Enter a valid email');return}if(ACC.users[em]){toast('Already added');return}ACC.users[em]=JSON.parse(JSON.stringify(ACC.defaults));ACC.users[em].name=(d.name||'').trim();saveAcc();render();toast('Added — ask them to sign in with '+em)},
fentry(d){const{kind,...data}=d;if(data.amt!=null)data.amt=+data.amt;sendEntry(kind,data)}});
Object.assign(A,{fweek(w){mWeek=+w;renderFamily()},ftask(id){const c=TK.tasks?.[id]||'todo';famTick('tasks',id,c==='todo'?'doing':c==='doing'?'done':'todo')}});
const ready=(async()=>{if(window.claudeReady)await window.claudeReady;for(let i=0;i<30&&!window.claude?.use;i++)await sleep(100);
try{if(window.claude?.use)[db,U]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch{db=null}
if(!db){role='local';try{const l=localStorage.getItem('hh-accounts-v3');if(l){S=JSON.parse(l);fix()}}catch{}setStatus('Preview — saved on this device only');render();return}
try{me=U?await U.id():null}catch{}let adm=false;try{adm=!!(U&&await U.canEdit())}catch{}
if(adm)startAdmin();else if(!me){role='none';render()}else startFamily()})();
const root=$('#root');
root.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),d={};for(const[k,v]of fd)if(k!=='day')d[k]=v;F[e.target.dataset.form]?.(d,fd.getAll('day'))});
root.addEventListener('click',e=>{if(e.target.id==='dlg'){closeDlg();dlgO=null;return}const b=e.target.closest('[data-act]');if(b){e.preventDefault();A[b.dataset.act]?.(b.dataset.id,b)}});
root.addEventListener('change',e=>{const t=e.target,k=t.dataset.chg;if(!k)return;
if(k==='month'){fMonth=t.value;render()}
else if(k==='acc'){const p=accUser(t.dataset.u,true),f=t.dataset.f;p[f]=f==='max'?Math.max(0,+t.value||0):f==='auto'?t.value==='1':t.value;saveAcc();if(f!=='name')render()}
else if(k==='accmod'){accUser(t.dataset.u,true).mods[t.dataset.m]=t.checked;saveAcc()}
else if(k==='acccat'){const p=accUser(t.dataset.u,true),c=t.dataset.c;p.cats=t.checked?[...new Set([...p.cats,c])]:p.cats.filter(x=>x!==c);saveAcc();const sm=t.closest('details')?.querySelector('summary');if(sm)sm.textContent='Allowed expense categories: '+(p.cats.length?p.cats.length+' selected':'all')}
else if(k==='ftick')famTick(t.dataset.p,t.dataset.id,t.checked);
else if(k==='ryear'){rYear=t.value;render()}
else if(k==='fcat'){fCat=t.value;render()}
else if(k==='groc'){const g=S.groceries.find(x=>x.id===t.dataset.id);commit(()=>{g.done=t.checked;tick('groc',g.id,t.checked)})}
else if(k==='clean')commit(()=>{const key=today+'|'+t.dataset.id;if(t.checked)S.cleanDone[key]=true;else delete S.cleanDone[key];tick('cleanDone',key,t.checked);for(const x in S.cleanDone)if(x.slice(0,10)<today)delete S.cleanDone[x]});
else if(k==='mdone')commit(()=>{const key=ym+'|'+t.dataset.id;if(t.checked)S.mDone[key]=true;else delete S.mDone[key]});
else if(k==='budget')commit(()=>S.budgets[t.dataset.cat]=Math.max(0,+t.value||0));
else if(k==='menu')commit(()=>S.menu[+t.dataset.w][+t.dataset.d][+t.dataset.m]=t.value,null,false,true);
else if(k==='menuNotes')commit(()=>S.menuNotes=t.value,null,false,true);
else if(k==='edit'){const o=S[t.dataset.k].find(x=>x.id===t.dataset.id),f=t.dataset.f,num=t.type==='number';if(!o)return;const old=o[f],val=num?Math.max(0,+t.value||0):t.value.trim();if(!num&&!val){t.value=old;return}
commit(()=>{o[f]=val;if(f==='name'&&(t.dataset.k==='members'||t.dataset.k==='staff')&&old!==val){for(const c of[...S.cleaning,...S.monthly,...S.work])if(c.who===old)c.who=val;for(const x of S.txns){if(x.by===old)x.by=val;if(x.frm===old)x.frm=val;if(x.to===old)x.to=val}}},null,false,!(num||f==='name'))}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg')?.hidden){closeDlg();dlgO=null}});
addEventListener('hashchange',()=>{if(role==='family')renderFamily();else render();scrollTo(0,0);if(innerWidth<=860)document.querySelector('.snav [aria-current]')?.scrollIntoView({inline:'center',block:'nearest'})});
render();
}
</script></body></html>
